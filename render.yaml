services:
  - type: web
    name: cavsulit-v2-api
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/ping
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DB_SSL
        value: "true"
      - key: DB_SYNC_ALTER
        value: "true"